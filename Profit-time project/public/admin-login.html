<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Profit Time</title>
  <style>
    body { font-family: 'Poppins', sans-serif; background:#000; color:#fff; }
    .form-container {
      max-width:400px; margin:50px auto; background:#111;
      padding:30px; border-radius:10px; border:2px solid #FFD700;
      box-shadow:0 0 15px #FFD700;
    }
    h1 { text-align:center; color:#FFD700; }
    label { display:block; margin:10px 0 5px; color:#FFD700; }
    input { width:100%; padding:12px; margin-bottom:15px;
      border:2px solid #FFD700; border-radius:5px; background:#000; color:#fff;
      box-sizing: border-box; }
    .password-box { position:relative; }
    .toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #FFD700;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      outline: none;
    }
    button { width:100%; padding:12px; background:#FFD700; color:#000;
      font-weight:bold; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#fff; color:#000; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Admin Login</h1>
    <form id="adminLoginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <div class="password-box">
        <input type="password" id="password" required>
        <button type="button" class="toggle-btn" id="toggleBtn">👁</button>
      </div>

      <button type="submit" id="adminLoginBtn">Login</button>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://zjqknqnvlmlkkgzglvjk.supabase.co',
      'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
    );

    document.getElementById("toggleBtn").addEventListener("click", () => {
      const field = document.getElementById("password");
      field.type = field.type === "password" ? "text" : "password";
    });

    const form = document.getElementById("adminLoginForm");
    const loginBtn = document.getElementById("adminLoginBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Checking...";

      const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
        email, password
      });

      if (signInError) {
        alert("Login failed: " + signInError.message);
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        return;
      }

      const user = signInData.user;

      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('is_admin')
        .eq('id', user.id)
        .single();

      if (profileError || !profile || !profile.is_admin) {
        alert("Access denied. Not an admin.");
        await supabase.auth.signOut();
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        return;
      }

      window.location.href = "adminportal.html";
    });
  </script>
</body>
</html>
