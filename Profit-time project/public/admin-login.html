<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Profit Time</title>
  <style>
    body { font-family: 'Poppins', sans-serif; background:#000; color:#fff; }
    .form-container {
      max-width:400px; margin:50px auto; background:#111;
      padding:30px; border-radius:10px; border:2px solid #FFD700;
      box-shadow:0 0 15px #FFD700;
    }
    h1 { text-align:center; color:#FFD700; }
    label { display:block; margin:10px 0 5px; color:#FFD700; }
    input { width:100%; padding:12px; margin-bottom:15px;
      border:2px solid #FFD700; border-radius:5px; background:#000; color:#fff; }
    .password-box { position:relative; }
    .toggle-btn {
     position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #FFD700;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      outline: none;
    }
    button { width:100%; padding:12px; background:#FFD700; color:#000;
      font-weight:bold; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#fff; color:#000; }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Admin Login</h1>
    <form onsubmit="loginAdmin(event)">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <div class="password-box">
        <input type="password" id="password" required>
        <button type="button" class="toggle-btn" onclick="togglePassword('password')">👁</button>
      </div>

      <button type="submit">Login</button>
    </form>
  </div>

  <script>
  


    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === "password" ? "text" : "password";
    }

    function loginAdmin(event) {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          const uid = userCredential.user.uid;
          return db.collection("admins").doc(uid).get();
        })
        .then(doc => {
          if (doc.exists) {
            window.location.href = "admin-portal.html";
          } else {
            alert("Access denied. Not an admin.");
            firebase.auth().signOut();
          }
        })
        .catch(error => alert("Login failed: " + error.message));
    }
  </script>
</body>
</html>
