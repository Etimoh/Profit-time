<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw - Profit Time</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#05070c;
      --bg-soft:#0b0f18;
      --card:#11151f;
      --border:#232b3d;
      --gold:#f0b90b;
      --gold-soft:#f0b90b1a;
      --text:#eef1f6;
      --text-dim:#8b93a7;
    }

    body {
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 20px;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(240,185,11,0.10), transparent 60%),
        var(--bg);
      font-family:'Inter',sans-serif;
      color:var(--text);
    }

    h1 {
      font-family:'Space Grotesk',sans-serif;
      font-size:26px;
      margin-bottom:8px;
      color:var(--text);
      text-align:center;
    }

    .form-card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:32px 28px;
      box-shadow:0 24px 70px rgba(0,0,0,0.4);
      max-width:480px;
      width:100%;
      animation:fadeIn .6s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes fadeIn {from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

    label {
      display:block;
      font-size:12.5px;
      font-weight:600;
      color:var(--text-dim);
      text-transform:uppercase;
      letter-spacing:0.5px;
      margin-bottom:8px;
    }

    input[type="number"], input[type="text"] {
      width:100%;
      padding:13px 14px;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--bg-soft);
      color:var(--text);
      font-size:14.5px;
      transition:border-color .25s ease, box-shadow .25s ease;
    }

    input:focus {
      outline:none;
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(240,185,11,0.15);
    }

    button {
      width:100%;
      padding:20px 20px 20px 40px;
      background:linear-gradient(145deg,var(--gold),#c99500);
      color:#05070c;
      font-size:15.5px;
      font-weight:700;
      border:none;
      border-radius:10px;
      cursor:pointer;
      transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s cubic-bezier(.22,1,.36,1), filter .25s ease;
    }

    button:hover {
      transform:translateY(-2px);
      box-shadow:0 10px 28px rgba(240,185,11,0.35);
      filter:brightness(1.05);
    }

    button:disabled {
      opacity:0.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .message {
      text-align:center;
      padding:40px 30px;
      display:none;
    }

    .message h2 {
      margin-bottom:8px;
      font-family:'Space Grotesk',sans-serif;
    }

    .message p {
      color:var(--text-dim);
      font-size:14.5px;
      line-height:1.6;
    }
  </style>
</head>
<body>

  <div class="form-card" id="withdrawForm">
    <h1>Withdraw Funds</h1>
    <form id="withForm">
      <div class="field">
        <label for="amount">Withdrawal Amount</label>
        <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
      </div>

      <div class="field">
        <label for="wallet">Your Wallet Address</label>
        <input type="text" id="wallet" name="wallet" placeholder="Enter your wallet address" required>
      </div>
<br>
      <button type="submit" id="withdrawBtn">Submit Withdrawal Request</button>
    </form>
  </div>

  <div class="form-card message" id="responseMessage">
    <div class="ic">✅</div>
    <h2>Request Submitted</h2>
    <p>Your withdrawal request is now pending admin approval.</p>
    <p>You'll be notified once it's processed.</p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://zjqknqnvlmlkkgzglvjk.supabase.co',
      'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
    );

    const withForm = document.getElementById("withForm");
    const withdrawBtn = document.getElementById("withdrawBtn");

    withForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
      }

      const amount = Number(document.getElementById("amount").value);
      const wallet = document.getElementById("wallet").value.trim();

      if (!Number.isFinite(amount) || amount <= 0) {
        alert("Please enter a valid withdrawal amount.");
        return;
      }

      withdrawBtn.disabled = true;
      withdrawBtn.textContent = "Submitting...";

      const { error } = await supabase.from('withdrawals').insert({
        user_id: user.id,
        amount: amount,
        wallet_address: wallet,
        status: "Pending"
      });

      if (error) {
        alert("Error: " + error.message);
        withdrawBtn.disabled = false;
        withdrawBtn.textContent = "Submit Withdrawal Request";
        return;
      }

      document.getElementById("withdrawForm").style.display = "none";
      document.getElementById("responseMessage").style.display = "block";
    });
  </script>
</body>
</html>
