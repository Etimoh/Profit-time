<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw - Profit Time</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
    }

    h1 {
      color: #FFD700;
      text-align: center;
      margin-top: 40px;
    }

    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #111;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #FFD700;
      box-shadow: 0 0 20px #FFD700;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #FFD700;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #FFD700;
      border-radius: 5px;
      background-color: #000;
      color: #fff;
    }

    input:focus {
      outline: none;
      border-color: #fff;
    }

    button {
      width: 100%;
      padding: 15px;
      background-color: #FFD700;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #fff;
      color: #000;
    }

    .message {
      text-align: center;
      color: #FFD700;
      font-size: 18px;
      margin-top: 20px;
      display: none;
    }

    @media (max-width: 600px) {
      .form-container {
        margin: 20px;
        padding: 20px;
      }
      h1 {
        font-size: 22px;
      }
      button {
        font-size: 16px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <h1>Withdraw Funds</h1>

  <div class="form-container" id="withdrawForm">
    <form id="withForm">
      <!-- Amount -->
      <label for="amount">Withdrawal Amount</label>
      <input type="number" id="amount" name="amount" required>

      <!-- Wallet Address -->
      <label for="wallet">Your Wallet Address</label>
      <input type="text" id="wallet" name="wallet" placeholder="Enter your wallet address" required>

      <!-- Payment Complete -->
      <button type="button" onclick="handleWithdraw()">Withdraw</button>
    </form>
  </div>

  <!-- Response Message -->
  <div class="message" id="responseMessage">
    ✅ Withdrawal request submitted.<br>
    ⏳ Awaiting admin approval...
  </div>

 

 <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://zjqknqnvlmlkkgzglvjk.supabase.co',
      'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
    );

    const withForm = document.getElementById("withForm");
    const withdrawBtn = document.getElementById("withdrawBtn");

    withForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
      }

      const amount = Number(document.getElementById("amount").value);
      const wallet = document.getElementById("wallet").value.trim();

      if (!Number.isFinite(amount) || amount <= 0) {
        alert("Please enter a valid withdrawal amount.");
        return;
      }

      withdrawBtn.disabled = true;
      withdrawBtn.textContent = "Submitting...";

      const { error } = await supabase.from('withdrawals').insert({
        user_id: user.id,
        amount: amount,
        wallet_address: wallet,
        status: "Pending"
      });

      if (error) {
        alert("Error: " + error.message);
        withdrawBtn.disabled = false;
        withdrawBtn.textContent = "Withdraw";
        return;
      }

      document.getElementById("withdrawForm").style.display = "none";
      document.getElementById("responseMessage").style.display = "block";
    });
  </script>
</body>
</html>
