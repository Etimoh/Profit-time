<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Profit Time</title>
  <style>
    /* ================================
       GLOBAL STYLES
       ================================ */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
    }

    h1, h2, h3 {
      color: #FFD700;
    }

    a {
      text-decoration: none;
      color: #FFD700;
    }

    /* ================================
       HEADER / NAVBAR
       ================================ */
    header {
      background-color: #111;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #FFD700;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    nav ul li a {
      color: #fff;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #FFD700;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }

    .hamburger span {
      height: 3px;
      width: 25px;
      background: #FFD700;
      margin: 4px 0;
    }

    nav ul.mobile {
      display: none;
      flex-direction: column;
      background-color: #111;
      position: absolute;
      top: 70px;
      right: 0;
      width: 200px;
      padding: 20px;
    }

    nav ul.mobile li {
      margin: 10px 0;
    }

    /* ================================
       HERO SECTION
       ================================ */
    .hero {
      height: 40vh;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                  url('../images/Contact\ hero.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero h1 {
      font-size: 50px;
      text-transform: uppercase;
    }

    /* ================================
       CONTACT SECTION
       ================================ */
    .contact-section {
      padding: 80px 50px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      background-color: #111;
    }

    .contact-form {
      flex: 1;
      min-width: 300px;
      margin-right: 40px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #FFD700;
      border-radius: 5px;
      background-color: #000;
      color: #fff;
    }

    .contact-form button {
      background-color: #FFD700;
      color: #000;
      padding: 12px 25px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border-radius: 5px;
    }

    .contact-form button:hover {
      background-color: #fff;
      color: #000;
    }

    /* ================================
       LINKS SECTION
       ================================ */
    .contact-links {
      flex: 1;
      min-width: 250px;
    }

    .contact-links h2 {
      margin-bottom: 20px;
    }

    .contact-links ul {
      list-style: none;
      padding: 0;
    }

    .contact-links ul li {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .contact-links ul li img {
      width: 24px;
      height: 24px;
    }

    .contact-links ul li a {
      color: #FFD700;
      font-weight: 500;
      transition: color 0.3s;
    }

    .contact-links ul li a:hover {
      color: #fff;
    }

    /* ================================
       FOOTER
       ================================ */
    footer {
      background-color: #000;
      color: #FFD700;
      text-align: center;
      padding: 20px;
    }

    /* ================================
       MEDIA QUERIES
       ================================ */
    @media (max-width: 768px) {
      nav ul.desktop {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .contact-section {
        flex-direction: column;
      }

      .contact-form {
        margin-right: 0;
        margin-bottom: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">PROFIT TIME</div>
    <nav>
      <ul class="desktop">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
      <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul class="mobile" id="mobileMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Contact Us</h1>
  </section>

  <!-- CONTACT SECTION -->
  <section class="contact-section">
    <!-- Contact Form -->
    <div class="contact-form" id="contactForm">
      <h2>Leave a Message</h2>
      <form onsubmit="handleSubmit(event)">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="6" placeholder="Your Message" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>

    <!-- Contact Links -->
    <div class="contact-links">
      <h2>Connect With Us</h2>
      <ul>
        <li><img src="../images/facebook logo.jpg" alt="Facebook"><a href="https://facebook.com" target="_blank">Facebook</a></li>
        <li><img src="../images/x logo.jpg" alt="Twitter"><a href="https://twitter.com" target="_blank">Twitter</a></li>
        <li><img src="../images/LinkedIn Icon.jpg" alt="LinkedIn"><a href="https://linkedin.com" target="_blank">LinkedIn</a></li>
        <li><img src="../images/Instagram PNG.jpg" alt="Instagram"><a href="https://instagram.com" target="_blank">Instagram</a></li>
        <li><img src="../images/gmail logo.jpg" alt="Email"><a href="mailto:support@profittime.com">Email Support</a></li>
      </ul>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Profit Time | All Rights Reserved</p>
  </footer>

  <!-- INTERNAL JS -->
  <script>
    



    /* Mobile Nav Toggle */
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    }

    /* Handle Form Submission */
    function handleSubmit(event) {
      event.preventDefault();
      const formSection = document.getElementById("contactForm");
      formSection.innerHTML = "<h2>Thank you for your message!</h2><p>We’ll get back to you shortly.</p>";
    }
  </script>
</body>
</html>
