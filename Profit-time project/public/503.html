<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>503 Service Unavailable - Profit Time</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .error-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #111, #000);
    }

    .error-box {
      border: 3px solid #FFD700;
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      box-shadow: 0 0 25px #FFD700;
      background-color: #111;
    }

    h1 {
      font-size: 60px;
      font-weight: 900;
      color: #FFD700;
      text-shadow: 0 0 15px #FFD700;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      padding: 12px 25px;
      background-color: #FFD700;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    a:hover {
      background-color: #fff;
      color: #000;
    }

    .redirect-message {
      margin-top: 20px;
      font-size: 16px;
      color: #FFD700;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-box">
      <h1>503</h1>
      <p>Service Unavailable. Our servers are temporarily busy or under maintenance.</p>
      <a href="index.html">Go Back Home</a>
      <div class="redirect-message">
        Redirecting you to the home page in <span id="countdown">5</span> seconds...
      </div>
    </div>
  </div>

  <script>
    
 

    // Auto redirect after countdown
    let seconds = 5;
    const countdownEl = document.getElementById("countdown");

    const interval = setInterval(() => {
      seconds--;
      countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = "index.html"; // Redirect to home page
      }
    }, 1000);
  </script>
</body>
</html>
