<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal - Profit Time</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
    }

    header {
      background-color: #111;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #FFD700;
    }

    header h1 {
      color: #FFD700;
      margin: 0;
    }

    .dashboard {
      max-width: 900px;
      margin: 40px auto;
      background-color: #111;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #FFD700;
      box-shadow: 0 0 20px #FFD700;
    }

    .dashboard h2 {
      color: #FFD700;
      margin-bottom: 20px;
    }

    .info {
      margin-bottom: 15px;
      font-size: 16px;
    }

    .info span {
      color: #FFD700;
      font-weight: bold;
    }

    .wallet {
      margin: 20px 0;
      padding: 20px;
      background-color: #222;
      border: 2px solid #FFD700;
      border-radius: 8px;
      text-align: center;
    }

    .wallet h3 {
      margin: 0;
      color: #FFD700;
    }

    .wallet-amount {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }
    .actions {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-top: 30px;
}

.actions .btn {
  display: inline-block;
  padding: 12px 25px;
  background-color: #FFD700;
  color: #000;
  font-weight: bold;
  text-decoration: none;
  border-radius: 8px;
  transition: 0.3s;
}

.actions .btn:hover {
  background-color: #fff;
  color: #000;
  box-shadow: 0 0 10px #FFD700;
}


    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }

    .actions button {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      background-color: #FFD700;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .actions button:hover {
      background-color: #fff;
      color: #000;
    }

    /* Responsive Media Queries */
    @media (max-width: 600px) {
      .dashboard {
        margin: 20px;
        padding: 20px;
      }
      header h1 {
        font-size: 22px;
      }
      .dashboard h2 {
        font-size: 20px;
      }
      .wallet-amount {
        font-size: 20px;
      }
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to Profit Time</h1>
  </header>

  <div class="dashboard">
    <h2>User Investment Details</h2>
    <div class="info">Name: <span id="userName"></span></div>
    <div class="info">Email: <span id="userEmail"></span></div>
    <div class="info">Location: <span id="userLocation"></span></div>
    <div class="info">Amount Range: <span id="userAmount"></span></div>
    <div class="info">Package: <span id="userPackage"></span></div>

    <div class="wallet">
      <h3>Wallet Balance</h3>
      <div class="wallet-amount" id="walletBalance">$0.00</div>
    </div>

    <div class="actions">
  <a href="deposit.html" class="btn">Deposit</a>
  <a href="withdrawal.html" class="btn">Withdraw</a>
  <a href="contact-admin.html" class="btn">Contact Admin</a>
  <a href="index.html" class="btn">Logout</a>
</div>

  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://zjqknqnvlmlkkgzglvjk.supabase.co',
      'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
    );

    async function loadUserData() {
      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .single();

      if (error || !profile) {
        alert("Error loading your details: " + (error ? error.message : "not found"));
        return;
      }

      document.getElementById("userName").textContent = profile.name || "—";
      document.getElementById("userEmail").textContent = profile.email || user.email;
      document.getElementById("userLocation").textContent = profile.location || "—";
      document.getElementById("userAmount").textContent = profile.amount_range || "—";
      document.getElementById("userPackage").textContent = profile.package_choice || "—";
      document.getElementById("walletBalance").textContent =
        `$${Number(profile.wallet || 0).toFixed(2)}`;
    }

    loadUserData();

    document.getElementById("logoutBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      const { error } = await supabase.auth.signOut();
      if (error) {
        alert("Logout failed: " + error.message);
        return;
      }
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
