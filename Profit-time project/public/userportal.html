<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Portal - Profit Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0a0d14;
    --bg-soft: #0f1420;
    --card: #131824;
    --card-hi: #171d2c;
    --border: #232b3d;
    --gold: #f0b90b;
    --gold-soft: #f0b90b1a;
    --text: #eef1f6;
    --text-dim: #8b93a7;
    --green: #16c784;
    --red: #ea3943;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 15% -10%, #f0b90b14, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #1a2a4014, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--border);
    background:rgba(10,13,20,0.85);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(145deg,var(--gold),#a97a00);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#0a0d14;font-size:15px;
  }
  .brand span{color:var(--gold);}
  #logoutBtn{
    color:var(--text-dim);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    border:1px solid var(--border);
    padding:9px 16px;
    border-radius:8px;
    transition:.2s;
  }
  #logoutBtn:hover{border-color:var(--gold);color:var(--gold);}

  /* ticker */
  .ticker-wrap{
    border-bottom:1px solid var(--border);
    background:var(--bg-soft);
    overflow:hidden;
    white-space:nowrap;
    padding:10px 0;
  }
  .ticker{
    display:inline-flex;
    animation:scroll 32s linear infinite;
  }
  .ticker-wrap:hover .ticker{animation-play-state:paused;}
  .tick-item{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:0 26px;
    font-size:13.5px;
    border-right:1px solid var(--border);
  }
  .tick-sym{font-weight:700;color:var(--text);}
  .tick-price{font-family:'JetBrains Mono',monospace;color:var(--text-dim);}
  .tick-chg{font-weight:600;font-family:'JetBrains Mono',monospace;}
  .up{color:var(--green);}
  .down{color:var(--red);}
  @keyframes scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:36px 24px 60px;
  }

  .hero{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:20px;
    margin-bottom:24px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:26px;
  }

  .wallet-card{
    background:linear-gradient(160deg,var(--card-hi),var(--card) 65%);
    position:relative;
    overflow:hidden;
  }
  .wallet-card::after{
    content:"";
    position:absolute;
    top:-60px;right:-60px;
    width:200px;height:200px;
    background:radial-gradient(circle,var(--gold-soft),transparent 70%);
  }
  .eyebrow{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--text-dim);
    font-weight:600;
    margin-bottom:10px;
  }
  .wallet-amount{
    font-family:'Space Grotesk',sans-serif;
    font-size:42px;
    font-weight:700;
    letter-spacing:-0.5px;
  }
  .wallet-sub{
    margin-top:8px;
    font-size:13.5px;
    color:var(--text-dim);
  }
  .wallet-sub b{color:var(--green);}

  .profile-card .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    font-size:14.5px;
  }
  .profile-card .row:last-child{border-bottom:none;}
  .profile-card .row .label{color:var(--text-dim);}
  .profile-card .row .val{font-weight:600;}
  .badge{
    background:var(--gold-soft);
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .avatar{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(145deg,var(--gold),#7a5800);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;color:#0a0d14;font-size:18px;
    margin-bottom:14px;
  }

  .section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    font-weight:600;
    margin:38px 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(22,199,132,.6);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(22,199,132,.55);}
    70%{box-shadow:0 0 0 8px rgba(22,199,132,0);}
    100%{box-shadow:0 0 0 0 rgba(22,199,132,0);}
  }

  .coin-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  .coin-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    transition:.2s;
  }
  .coin-card:hover{border-color:#3a4258;transform:translateY(-2px);}
  .coin-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .coin-name{font-weight:700;font-size:14.5px;}
  .coin-sym{color:var(--text-dim);font-size:12px;}
  .coin-price{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-weight:700;
    margin-top:10px;
  }
  .coin-chg{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:600;
    margin-top:4px;
  }

  .chart-card{margin-top:16px;}
  .chart-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:10px;
  }
  .chart-price{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
  }
  .range-btns{display:flex;gap:6px;}
  .range-btns button{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .range-btns button.active,
  .range-btns button:hover{
    border-color:var(--gold);
    color:var(--gold);
  }
  .chart-canvas-wrap{height:280px;}

  .actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:36px;
  }
  .btn{
    display:flex;
    flex-direction:column;
    gap:4px;
    text-align:center;
    align-items:center;
    padding:18px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    transition:.2s;
  }
  .btn .ic{font-size:20px;}
  .btn:hover{border-color:var(--gold);background:var(--card-hi);color:var(--gold);}
  .btn.primary{
    background:linear-gradient(145deg,var(--gold),#c99500);
    color:#0a0d14;
    border-color:transparent;
  }
  .btn.primary:hover{color:#0a0d14;filter:brightness(1.08);}

  footer{
    text-align:center;
    padding:30px;
    color:var(--text-dim);
    font-size:12.5px;
    border-top:1px solid var(--border);
  }

  @media (max-width:760px){
    .hero{grid-template-columns:1fr;}
    .coin-grid{grid-template-columns:repeat(2,1fr);}
    .actions{grid-template-columns:repeat(2,1fr);}
    .wallet-amount{font-size:34px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="brand-mark">PT</div>Profit<span>Time</span></div>
  <a href="#" id="logoutBtn">Log out</a>
</header>

<div class="ticker-wrap">
  <div class="ticker" id="tickerTrack"></div>
</div>

<main>

  <div class="hero">
    <div class="card wallet-card">
      <div class="eyebrow">Wallet balance</div>
      <div class="wallet-amount" id="walletBalance">$0.00</div>
      <div class="wallet-sub">Package: <b id="userPackage2">—</b></div>
    </div>

    <div class="card profile-card">
      <div class="avatar" id="avatarInitial">•</div>
      <div class="row">
        <span class="label">Name</span>
        <span class="val" id="userName">Loading…</span>
      </div>
      <div class="row">
        <span class="label">Package</span>
        <span class="val badge" id="userPackage">—</span>
      </div>
      <div class="row">
        <span class="label">Status</span>
        <span class="val badge" style="background:#16c78420;color:var(--green);">Active</span>
      </div>
    </div>
  </div>

  <div class="section-title"><span class="live-dot"></span> Live Market</div>
  <div class="coin-grid" id="coinGrid"></div>

  <div class="card chart-card">
    <div class="chart-head">
      <div>
        <div class="eyebrow">Bitcoin · BTC</div>
        <div class="chart-price" id="btcPrice">Loading…</div>
      </div>
      <div class="range-btns" id="rangeBtns">
        <button data-days="1" class="active">24H</button>
        <button data-days="7">7D</button>
        <button data-days="30">30D</button>
        <button data-days="365">1Y</button>
      </div>
    </div>
    <div class="chart-canvas-wrap">
      <canvas id="btcChart"></canvas>
    </div>
  </div>

  <div class="section-title">Quick actions</div>
  <div class="actions">
    <a href="deposit.html" class="btn primary"><span class="ic">↓</span>Deposit</a>
    <a href="withdrawal.html" class="btn"><span class="ic">↑</span>Withdraw</a>
    <a href="mailto:support@profittime.com?subject=Support Request" class="btn"><span class="ic">✉</span>Support</a>
    <a href="#" class="btn" id="logoutBtn2"><span class="ic">⏻</span>Log out</a>
  </div>

</main>

<footer>Market data via CoinGecko · Prices update automatically · Profit Time © 2026</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://zjqknqnvlmlkkgzglvjk.supabase.co',
    'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
  );

  async function loadUserData() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }

    const { data: profile, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .single();

    if (error || !profile) {
      alert("Error loading your details: " + (error ? error.message : "not found"));
      return;
    }

    const name = profile.name || "—";
    document.getElementById("userName").textContent = name;
    document.getElementById("userPackage").textContent = profile.package_choice || "—";
    document.getElementById("userPackage2").textContent = profile.package_choice || "—";
    document.getElementById("walletBalance").textContent =
      `$${Number(profile.wallet || 0).toFixed(2)}`;
    document.getElementById("avatarInitial").textContent =
      name && name !== "—" ? name.trim().charAt(0).toUpperCase() : "U";
  }

  loadUserData();

  function bindLogout(id) {
    document.getElementById(id).addEventListener("click", async (e) => {
      e.preventDefault();
      const { error } = await supabase.auth.signOut();
      if (error) { alert("Logout failed: " + error.message); return; }
      window.location.href = "login.html";
    });
  }
  bindLogout("logoutBtn");
  bindLogout("logoutBtn2");
</script>

<script>
  // ---- Live crypto data (CoinGecko, no API key required) ----
  const COINS = [
    { id: "bitcoin", sym: "BTC", name: "Bitcoin" },
    { id: "ethereum", sym: "ETH", name: "Ethereum" },
    { id: "solana", sym: "SOL", name: "Solana" },
    { id: "binancecoin", sym: "BNB", name: "BNB" },
    { id: "ripple", sym: "XRP", name: "XRP" },
    { id: "dogecoin", sym: "DOGE", name: "Dogecoin" },
    { id: "cardano", sym: "ADA", name: "Cardano" },
    { id: "tron", sym: "TRX", name: "TRON" },
    { id: "avalanche-2", sym: "AVAX", name: "Avalanche" }
  ];
  const ids = COINS.map(c => c.id).join(",");

  function fmtPrice(p) {
    if (p >= 1000) return "$" + p.toLocaleString(undefined, {maximumFractionDigits:0});
    if (p >= 1) return "$" + p.toFixed(2);
    return "$" + p.toFixed(4);
  }

  async function fetchPrices() {
    try {
      const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
      const data = await res.json();
      renderCoinGrid(data);
      renderTicker(data);
      const btc = data.bitcoin;
      if (btc) document.getElementById("btcPrice").textContent = fmtPrice(btc.usd);
    } catch (e) {
      console.error("Price fetch failed", e);
    }
  }

  function renderCoinGrid(data) {
    const grid = document.getElementById("coinGrid");
    grid.innerHTML = COINS.map(c => {
      const d = data[c.id];
      if (!d) return "";
      const chg = d.usd_24h_change ?? 0;
      const dir = chg >= 0 ? "up" : "down";
      const arrow = chg >= 0 ? "▲" : "▼";
      return `
        <div class="coin-card">
          <div class="coin-top">
            <div>
              <div class="coin-name">${c.name}</div>
              <div class="coin-sym">${c.sym}</div>
            </div>
          </div>
          <div class="coin-price">${fmtPrice(d.usd)}</div>
          <div class="coin-chg ${dir}">${arrow} ${Math.abs(chg).toFixed(2)}%</div>
        </div>`;
    }).join("");
  }

  function renderTicker(data) {
    const track = document.getElementById("tickerTrack");
    const items = COINS.map(c => {
      const d = data[c.id];
      if (!d) return "";
      const chg = d.usd_24h_change ?? 0;
      const dir = chg >= 0 ? "up" : "down";
      const arrow = chg >= 0 ? "▲" : "▼";
      return `<div class="tick-item">
        <span class="tick-sym">${c.sym}</span>
        <span class="tick-price">${fmtPrice(d.usd)}</span>
        <span class="tick-chg ${dir}">${arrow} ${Math.abs(chg).toFixed(2)}%</span>
      </div>`;
    }).join("");
    // duplicate for seamless scroll loop
    track.innerHTML = items + items;
  }

  fetchPrices();
  setInterval(fetchPrices, 30000);

  // ---- BTC chart ----
  let btcChart;
  async function loadChart(days) {
    try {
      const res = await fetch(`https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=${days}`);
      const json = await res.json();
      const prices = json.prices || [];
      const labels = prices.map(p => {
        const d = new Date(p[0]);
        return days <= 1
          ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
          : d.toLocaleDateString([], {month:'short', day:'numeric'});
      });
      const values = prices.map(p => p[1]);

      const ctx = document.getElementById('btcChart').getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 280);
      gradient.addColorStop(0, 'rgba(240,185,11,0.35)');
      gradient.addColorStop(1, 'rgba(240,185,11,0)');

      if (btcChart) btcChart.destroy();
      btcChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: values,
            borderColor: '#f0b90b',
            backgroundColor: gradient,
            fill: true,
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              ticks: { color: '#8b93a7', maxTicksLimit: 6, font: { size: 11 } },
              grid: { display: false }
            },
            y: {
              ticks: {
                color: '#8b93a7',
                font: { size: 11 },
                callback: v => '$' + v.toLocaleString()
              },
              grid: { color: '#1c2333' }
            }
          }
        }
      });
    } catch (e) {
      console.error("Chart fetch failed", e);
    }
  }

  loadChart(1);

  document.querySelectorAll('#rangeBtns button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#rangeBtns button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadChart(btn.dataset.days);
    });
  });
</script>

</body>
</html>
