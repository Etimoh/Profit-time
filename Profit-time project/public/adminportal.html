<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal - Profit Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d14;
    --bg-soft: #0f1420;
    --card: #131824;
    --card-hi: #171d2c;
    --border: #232b3d;
    --gold: #f0b90b;
    --gold-soft: #f0b90b1a;
    --text: #eef1f6;
    --text-dim: #8b93a7;
    --green: #16c784;
    --green-soft: #16c78420;
    --red: #ea3943;
    --red-soft: #ea394320;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 15% -10%, #f0b90b14, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #1a2a4014, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--border);
    background:rgba(10,13,20,0.85);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(145deg,var(--gold),#a97a00);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#0a0d14;font-size:15px;
  }
  .brand span{color:var(--gold);}
  .admin-tag{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    background:var(--gold-soft);
    color:var(--gold);
    padding:3px 9px;
    border-radius:6px;
    margin-left:2px;
  }
  .head-right{display:flex;align-items:center;gap:14px;}
  #logoutBtn{
    color:var(--text-dim);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    border:1px solid var(--border);
    padding:9px 16px;
    border-radius:8px;
    transition:.2s;
  }
  #logoutBtn:hover{border-color:var(--gold);color:var(--gold);}

  main{
    max-width:1280px;
    margin:0 auto;
    padding:32px 24px 60px;
  }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:28px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    position:relative;
    overflow:hidden;
  }
  .stat-card::after{
    content:"";
    position:absolute;top:-40px;right:-40px;
    width:120px;height:120px;
    background:radial-gradient(circle,var(--gold-soft),transparent 70%);
  }
  .stat-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--text-dim);
    font-weight:600;
    margin-bottom:10px;
  }
  .stat-value{
    font-family:'Space Grotesk',sans-serif;
    font-size:32px;
    font-weight:700;
  }

  .section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    font-weight:600;
    margin:8px 0 14px;
  }

  .grid-2col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    align-items:start;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
  }

  input[type="text"], input[type="number"]{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--bg-soft);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    margin-bottom:16px;
  }
  input[type="text"]:focus, input[type="number"]:focus{
    outline:none;
    border-color:var(--gold);
  }
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--text-dim);
    margin-bottom:7px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .user-list{
    max-height:420px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .user-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    transition:.15s;
  }
  .user-item:hover{border-color:var(--gold);background:var(--card-hi);}
  .user-item.selected{border-color:var(--gold);background:var(--gold-soft);}
  .mini-avatar{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(145deg,var(--gold),#7a5800);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;color:#0a0d14;font-size:14px;
    flex-shrink:0;
  }
  .user-item .u-name{font-weight:600;font-size:14px;}
  .user-item .u-email{font-size:12.5px;color:var(--text-dim);}

  .user-details{margin-top:20px;}
  .detail-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .detail-row .label2{color:var(--text-dim);}
  .detail-row .val{font-weight:600;}

  button{
    padding:10px 18px;
    background:linear-gradient(145deg,var(--gold),#c99500);
    color:#0a0d14;
    font-size:13.5px;
    font-weight:700;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
  }
  button:hover{filter:brightness(1.08);}
  button.reject{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
  }
  button.reject:hover{border-color:var(--red);color:var(--red);filter:none;}

  .request-item{
    padding:14px;
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:10px;
  }
  .request-item .who{font-weight:600;font-size:14px;}
  .request-item .amt{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--gold);
    margin-top:4px;
  }
  .request-item .addr{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:4px;
    word-break:break-all;
  }
  .request-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .empty-state{
    color:var(--text-dim);
    font-size:13.5px;
    padding:20px 0;
    text-align:center;
  }

  @media (max-width:860px){
    .stats-row{grid-template-columns:1fr;}
    .grid-2col{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="brand-mark">PT</div>Profit<span>Time</span><span class="admin-tag">Admin</span></div>
  <div class="head-right">
    <a href="#" id="logoutBtn">Log out</a>
  </div>
</header>

<main>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Users</div>
      <div class="stat-value" id="totalUsers">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending Deposits</div>
      <div class="stat-value" id="pendingDeposits">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending Withdrawals</div>
      <div class="stat-value" id="pendingWithdrawals">—</div>
    </div>
  </div>

  <div class="grid-2col">
    <div>
      <div class="section-title">Registered Users</div>
      <div class="card">
        <input type="text" id="searchUser" placeholder="Search user by name or email">
        <div class="user-list" id="userList">Loading users…</div>

        <div class="user-details" id="userDetails" style="display:none;">
          <div class="section-title" style="margin-top:22px;">User Details</div>
          <div class="detail-row"><span class="label2">Name</span><span class="val" id="detailName"></span></div>
          <div class="detail-row"><span class="label2">Package</span><span class="val" id="detailPackage"></span></div>

          <div style="margin-top:18px;">
            <label for="balance">Wallet Balance</label>
            <input type="number" id="balance" step="0.01" placeholder="Enter new balance">
            <button id="updateBalanceBtn">Update Balance</button>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Deposit Requests</div>
      <div class="card" style="margin-bottom:20px;">
        <div id="depositRequests">Loading deposits…</div>
      </div>

      <div class="section-title">Withdrawal Requests</div>
      <div class="card">
        <div id="withdrawRequests">Loading withdrawals…</div>
      </div>
    </div>
  </div>

</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://zjqknqnvlmlkkgzglvjk.supabase.co',
    'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
  );

  let allUsers = [];
  let selectedUserId = null;

  function initials(name) {
    if (!name) return "U";
    return name.trim().charAt(0).toUpperCase();
  }

  // --- Guard: must be logged in AND is_admin ---
  async function requireAdmin() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
      window.location.href = "admin-login.html";
      return null;
    }
    const { data: profile } = await supabase
      .from('profiles')
      .select('is_admin')
      .eq('id', user.id)
      .single();

    if (!profile || !profile.is_admin) {
      alert("Access denied. Not an admin.");
      window.location.href = "admin-login.html";
      return null;
    }
    return user;
  }

  function renderUserList(users) {
    const userList = document.getElementById("userList");
    userList.innerHTML = "";
    if (users.length === 0) {
      userList.innerHTML = `<div class="empty-state">No users found.</div>`;
      return;
    }
    users.forEach(u => {
      const div = document.createElement("div");
      div.className = "user-item" + (u.id === selectedUserId ? " selected" : "");
      div.innerHTML = `
        <div class="mini-avatar">${initials(u.name)}</div>
        <div>
          <div class="u-name">${u.name || "(no name)"}</div>
          <div class="u-email">${u.email || "no email"}</div>
        </div>
      `;
      div.onclick = () => loadUserDetails(u);
      userList.appendChild(div);
    });
  }

  function loadUserDetails(u) {
    selectedUserId = u.id;
    document.getElementById("detailName").textContent = u.name || "—";
    document.getElementById("detailPackage").textContent = u.package_choice || "—";
    document.getElementById("balance").value = u.wallet || 0;
    document.getElementById("userDetails").style.display = "block";
    renderUserList(currentFiltered());
  }

  function currentFiltered() {
    const term = document.getElementById("searchUser").value.toLowerCase();
    if (!term) return allUsers;
    return allUsers.filter(u =>
      (u.name || "").toLowerCase().includes(term) ||
      (u.email || "").toLowerCase().includes(term)
    );
  }

  document.getElementById("updateBalanceBtn").addEventListener("click", async () => {
    const newBalance = Number(document.getElementById("balance").value);
    if (!selectedUserId) {
      alert("No user selected.");
      return;
    }
    const { error } = await supabase
      .from('profiles')
      .update({ wallet: newBalance })
      .eq('id', selectedUserId);

    if (error) {
      alert("Error updating balance: " + error.message);
    } else {
      alert("Balance updated successfully!");
      loadAll();
    }
  });

  document.getElementById("searchUser").addEventListener("input", () => {
    renderUserList(currentFiltered());
  });

  async function loadUsers() {
    const { data: users, error } = await supabase.from('profiles').select('*');
    if (error) {
      document.getElementById("userList").innerHTML =
        `<div class="empty-state">Error loading users: ${error.message}</div>`;
      return;
    }
    allUsers = users || [];
    document.getElementById("totalUsers").textContent = allUsers.length;
    renderUserList(currentFiltered());
  }

  async function approveDeposit(depositId, userId, amount) {
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('wallet')
      .eq('id', userId)
      .single();

    if (profileError) {
      alert("Error looking up user: " + profileError.message);
      return;
    }

    const newBalance = Number(profile.wallet || 0) + Number(amount);

    const { error: updateError } = await supabase
      .from('profiles')
      .update({ wallet: newBalance })
      .eq('id', userId);

    if (updateError) {
      alert("Error updating balance: " + updateError.message);
      return;
    }

    const { error: statusError } = await supabase
      .from('deposits')
      .update({ status: "Approved" })
      .eq('id', depositId);

    if (statusError) {
      alert("Balance updated, but failed to mark deposit approved: " + statusError.message);
      return;
    }

    alert("Deposit approved and balance updated!");
    loadAll();
  }

  async function rejectDeposit(depositId) {
    const { error } = await supabase
      .from('deposits')
      .update({ status: "Rejected" })
      .eq('id', depositId);

    if (error) {
      alert("Error: " + error.message);
      return;
    }
    loadAll();
  }

  async function approveWithdrawal(withdrawalId, userId, amount) {
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('wallet')
      .eq('id', userId)
      .single();

    if (profileError) {
      alert("Error looking up user: " + profileError.message);
      return;
    }

    const currentBalance = Number(profile.wallet || 0);
    if (currentBalance < Number(amount)) {
      alert("User's wallet balance is lower than the withdrawal amount. Approve anyway with caution.");
    }

    const newBalance = currentBalance - Number(amount);

    const { error: updateError } = await supabase
      .from('profiles')
      .update({ wallet: newBalance })
      .eq('id', userId);

    if (updateError) {
      alert("Error updating balance: " + updateError.message);
      return;
    }

    const { error: statusError } = await supabase
      .from('withdrawals')
      .update({ status: "Approved" })
      .eq('id', withdrawalId);

    if (statusError) {
      alert("Balance updated, but failed to mark withdrawal approved: " + statusError.message);
      return;
    }

    alert("Withdrawal approved and balance updated!");
    loadAll();
  }

  async function rejectWithdrawal(withdrawalId) {
    const { error } = await supabase
      .from('withdrawals')
      .update({ status: "Rejected" })
      .eq('id', withdrawalId);

    if (error) {
      alert("Error: " + error.message);
      return;
    }
    loadAll();
  }

  async function loadDeposits() {
    const { data: deposits, error } = await supabase
      .from('deposits')
      .select('*, profiles(name, email)')
      .eq('status', 'Pending');

    const container = document.getElementById("depositRequests");
    container.innerHTML = "";

    if (error) {
      container.innerHTML = `<div class="empty-state">Error loading deposits: ${error.message}</div>`;
      return;
    }

    document.getElementById("pendingDeposits").textContent = deposits.length;

    if (deposits.length === 0) {
      container.innerHTML = `<div class="empty-state">No pending deposits.</div>`;
      return;
    }

    deposits.forEach(d => {
      const div = document.createElement("div");
      div.className = "request-item";
      const who = d.profiles ? `${d.profiles.name || ""} (${d.profiles.email || ""})` : d.user_id;
      div.innerHTML = `
        <div class="who">${who}</div>
        <div class="amt">$${Number(d.amount).toFixed(2)}</div>
        <div class="request-actions"></div>
      `;
      const actions = div.querySelector(".request-actions");

      const approveBtn = document.createElement("button");
      approveBtn.textContent = "Approve";
      approveBtn.onclick = () => approveDeposit(d.id, d.user_id, d.amount);

      const rejectBtn = document.createElement("button");
      rejectBtn.textContent = "Reject";
      rejectBtn.className = "reject";
      rejectBtn.onclick = () => rejectDeposit(d.id);

      actions.appendChild(approveBtn);
      actions.appendChild(rejectBtn);
      container.appendChild(div);
    });
  }

  async function loadWithdrawals() {
    const { data: withdrawals, error } = await supabase
      .from('withdrawals')
      .select('*, profiles(name, email)')
      .eq('status', 'Pending');

    const container = document.getElementById("withdrawRequests");
    container.innerHTML = "";

    if (error) {
      container.innerHTML = `<div class="empty-state">Error loading withdrawals: ${error.message}</div>`;
      return;
    }

    document.getElementById("pendingWithdrawals").textContent = withdrawals.length;

    if (withdrawals.length === 0) {
      container.innerHTML = `<div class="empty-state">No pending withdrawals.</div>`;
      return;
    }

    withdrawals.forEach(w => {
      const div = document.createElement("div");
      div.className = "request-item";
      const who = w.profiles ? `${w.profiles.name || ""} (${w.profiles.email || ""})` : w.user_id;
      div.innerHTML = `
        <div class="who">${who}</div>
        <div class="amt">$${Number(w.amount).toFixed(2)}</div>
        <div class="addr">${w.wallet_address || "—"}</div>
        <div class="request-actions"></div>
      `;
      const actions = div.querySelector(".request-actions");

      const approveBtn = document.createElement("button");
      approveBtn.textContent = "Approve";
      approveBtn.onclick = () => approveWithdrawal(w.id, w.user_id, w.amount);

      const rejectBtn = document.createElement("button");
      rejectBtn.textContent = "Reject";
      rejectBtn.className = "reject";
      rejectBtn.onclick = () => rejectWithdrawal(w.id);

      actions.appendChild(approveBtn);
      actions.appendChild(rejectBtn);
      container.appendChild(div);
    });
  }

  async function loadAll() {
    await Promise.all([loadUsers(), loadDeposits(), loadWithdrawals()]);
  }

  document.getElementById("logoutBtn").addEventListener("click", async (e) => {
    e.preventDefault();
    const { error } = await supabase.auth.signOut();
    if (error) { alert("Logout failed: " + error.message); return; }
    window.location.href = "admin-login.html";
  });

  requireAdmin().then(user => {
    if (user) loadAll();
  });
</script>
</body>
</html>
