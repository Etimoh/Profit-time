<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Profit Time</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
    }

    header {
      background-color: #111;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #FFD700;
    }

    header h1 {
      color: #FFD700;
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      background-color: #111;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #FFD700;
      box-shadow: 0 0 20px #FFD700;
    }

    h2 {
      color: #FFD700;
      margin-bottom: 20px;
      border-bottom: 1px solid #FFD700;
      padding-bottom: 5px;
    }

    .user-list {
      margin-bottom: 30px;
    }

    .user-item {
      padding: 12px;
      border: 1px solid #FFD700;
      border-radius: 5px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .user-item:hover {
      background-color: #222;
    }

    .user-details {
      margin-top: 20px;
      padding: 20px;
      background-color: #222;
      border: 2px solid #FFD700;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #FFD700;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #FFD700;
      border-radius: 5px;
      background-color: #000;
      color: #fff;
    }

    button {
      padding: 12px 20px;
      background-color: #FFD700;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #fff;
      color: #000;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px;
        padding: 20px;
      }
      header h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>Admin Portal</h1>
</header>

<div class="container">
  <!-- Dashboard Summary -->
  <section class="summary">
    <h2>Dashboard Summary</h2>
    <div>Total Users: <span id="totalUsers"></span></div>
    <div>Pending Deposits: <span id="pendingDeposits"></span></div>
    <div>Pending Withdrawals: <span id="pendingWithdrawals"></span></div>
  </section>

  <!-- User Management -->
  <section class="users">
    <h2>Registered Users</h2>
    <input type="text" id="searchUser" placeholder="Search user by name or email">
    <div class="user-list" id="userList"></div>
  </section>

  <!-- Payment Requests -->
  <section class="requests">
    <h2>Payment Requests</h2>
    <div id="depositRequests">Deposits will load here...</div>
    <div id="withdrawRequests">Withdrawals will load here...</div>
  </section>

  <!-- User Details -->
  <section class="user-details" id="userDetails" style="display:none;">
    <h2>User Details</h2>
    <div>Name: <span id="detailName"></span></div>
    <div>Email: <span id="detailEmail"></span></div>
    <div>Location: <span id="detailLocation"></span></div>
    <div>Package: <span id="detailPackage"></span></div>

    <label for="balance">Wallet Balance</label>
    <input type="number" id="balance" placeholder="Enter new balance">
    <button onclick="updateBalance()">Update Balance</button>
  </section>
</div>
 <div class="container">
    <h2>Registered Users</h2>
    <div class="user-list" id="userList">
      <!-- User items will load here -->
    </div>

    <div class="user-details" id="userDetails" style="display:none;">
      <h2>User Details</h2>
      <div>Name: <span id="detailName"></span></div>
      <div>Email: <span id="detailEmail"></span></div>
      <div>Location: <span id="detailLocation"></span></div>
      <div>Package: <span id="detailPackage"></span></div>

      <label for="balance">Wallet Balance</label>
      <input type="number" id="balance" placeholder="Enter new balance">

      <button onclick="updateBalance()">Update Balance</button>
    </div>
  </div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://zjqknqnvlmlkkgzglvjk.supabase.co',
    'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
  );

  let allUsers = [];
  let selectedUserId = null;

  // --- Guard: must be logged in AND is_admin ---
  async function requireAdmin() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
      window.location.href = "admin-login.html";
      return null;
    }
    const { data: profile } = await supabase
      .from('profiles')
      .select('is_admin')
      .eq('id', user.id)
      .single();

    if (!profile || !profile.is_admin) {
      alert("Access denied. Not an admin.");
      window.location.href = "admin-login.html";
      return null;
    }
    return user;
  }

  function renderUserList(users) {
    const userList = document.getElementById("userList");
    userList.innerHTML = "";
    if (users.length === 0) {
      userList.textContent = "No users found.";
      return;
    }
    users.forEach(u => {
      const div = document.createElement("div");
      div.className = "user-item";
      div.textContent = `${u.name || "(no name)"} (${u.email || "no email"})`;
      div.onclick = () => loadUserDetails(u);
      userList.appendChild(div);
    });
  }

  function loadUserDetails(u) {
    selectedUserId = u.id;
    document.getElementById("detailName").textContent = u.name || "—";
    document.getElementById("detailEmail").textContent = u.email || "—";
    document.getElementById("detailLocation").textContent = u.location || "—";
    document.getElementById("detailPackage").textContent = u.package_choice || "—";
    document.getElementById("balance").value = u.wallet || 0;
    document.getElementById("userDetails").style.display = "block";
  }

  document.getElementById("updateBalanceBtn").addEventListener("click", async () => {
    const newBalance = Number(document.getElementById("balance").value);
    if (!selectedUserId) {
      alert("No user selected.");
      return;
    }
    const { error } = await supabase
      .from('profiles')
      .update({ wallet: newBalance })
      .eq('id', selectedUserId);

    if (error) {
      alert("Error updating balance: " + error.message);
    } else {
      alert("Balance updated successfully!");
      loadAll();
    }
  });

  document.getElementById("searchUser").addEventListener("input", (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = allUsers.filter(u =>
      (u.name || "").toLowerCase().includes(term) ||
      (u.email || "").toLowerCase().includes(term)
    );
    renderUserList(filtered);
  });

  async function loadUsers() {
    const { data: users, error } = await supabase.from('profiles').select('*');
    if (error) {
      document.getElementById("userList").textContent = "Error loading users: " + error.message;
      return;
    }
    allUsers = users || [];
    document.getElementById("totalUsers").textContent = allUsers.length;
    renderUserList(allUsers);
  }

  async function approveDeposit(depositId, userId, amount) {
    // Look up current wallet balance
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('wallet')
      .eq('id', userId)
      .single();

    if (profileError) {
      alert("Error looking up user: " + profileError.message);
      return;
    }

    const newBalance = Number(profile.wallet || 0) + Number(amount);

    const { error: updateError } = await supabase
      .from('profiles')
      .update({ wallet: newBalance })
      .eq('id', userId);

    if (updateError) {
      alert("Error updating balance: " + updateError.message);
      return;
    }

    const { error: statusError } = await supabase
      .from('deposits')
      .update({ status: "Approved" })
      .eq('id', depositId);

    if (statusError) {
      alert("Balance updated, but failed to mark deposit approved: " + statusError.message);
      return;
    }

    alert("Deposit approved and balance updated!");
    loadAll();
  }

  async function rejectDeposit(depositId) {
    const { error } = await supabase
      .from('deposits')
      .update({ status: "Rejected" })
      .eq('id', depositId);

    if (error) {
      alert("Error: " + error.message);
      return;
    }
    loadAll();
  }

  async function approveWithdrawal(withdrawalId, userId, amount) {
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('wallet')
      .eq('id', userId)
      .single();

    if (profileError) {
      alert("Error looking up user: " + profileError.message);
      return;
    }

    const currentBalance = Number(profile.wallet || 0);
    if (currentBalance < Number(amount)) {
      alert("User's wallet balance is lower than the withdrawal amount. Approve anyway with caution.");
    }

    const newBalance = currentBalance - Number(amount);

    const { error: updateError } = await supabase
      .from('profiles')
      .update({ wallet: newBalance })
      .eq('id', userId);

    if (updateError) {
      alert("Error updating balance: " + updateError.message);
      return;
    }

    const { error: statusError } = await supabase
      .from('withdrawals')
      .update({ status: "Approved" })
      .eq('id', withdrawalId);

    if (statusError) {
      alert("Balance updated, but failed to mark withdrawal approved: " + statusError.message);
      return;
    }

    alert("Withdrawal approved and balance updated!");
    loadAll();
  }

  async function rejectWithdrawal(withdrawalId) {
    const { error } = await supabase
      .from('withdrawals')
      .update({ status: "Rejected" })
      .eq('id', withdrawalId);

    if (error) {
      alert("Error: " + error.message);
      return;
    }
    loadAll();
  }

  async function loadDeposits() {
    const { data: deposits, error } = await supabase
      .from('deposits')
      .select('*, profiles(name, email)')
      .eq('status', 'Pending');

    const container = document.getElementById("depositRequests");
    container.innerHTML = "";

    if (error) {
      container.textContent = "Error loading deposits: " + error.message;
      return;
    }

    document.getElementById("pendingDeposits").textContent = deposits.length;

    if (deposits.length === 0) {
      container.textContent = "No pending deposits.";
      return;
    }

    deposits.forEach(d => {
      const div = document.createElement("div");
      div.className = "request-item";
      const who = d.profiles ? `${d.profiles.name || ""} (${d.profiles.email || ""})` : d.user_id;
      div.innerHTML = `
        <div>User: ${who}</div>
        <div>Amount: $${Number(d.amount).toFixed(2)}</div>
      `;
      const approveBtn = document.createElement("button");
      approveBtn.textContent = "Approve";
      approveBtn.onclick = () => approveDeposit(d.id, d.user_id, d.amount);

      const rejectBtn = document.createElement("button");
      rejectBtn.textContent = "Reject";
      rejectBtn.className = "reject";
      rejectBtn.onclick = () => rejectDeposit(d.id);

      div.appendChild(approveBtn);
      div.appendChild(rejectBtn);
      container.appendChild(div);
    });
  }

  async function loadWithdrawals() {
    const { data: withdrawals, error } = await supabase
      .from('withdrawals')
      .select('*, profiles(name, email)')
      .eq('status', 'Pending');

    const container = document.getElementById("withdrawRequests");
    container.innerHTML = "";

    if (error) {
      container.textContent = "Error loading withdrawals: " + error.message;
      return;
    }

    document.getElementById("pendingWithdrawals").textContent = withdrawals.length;

    if (withdrawals.length === 0) {
      container.textContent = "No pending withdrawals.";
      return;
    }

    withdrawals.forEach(w => {
      const div = document.createElement("div");
      div.className = "request-item";
      const who = w.profiles ? `${w.profiles.name || ""} (${w.profiles.email || ""})` : w.user_id;
      div.innerHTML = `
        <div>User: ${who}</div>
        <div>Amount: $${Number(w.amount).toFixed(2)}</div>
        <div>Wallet: ${w.wallet_address || "—"}</div>
      `;
      const approveBtn = document.createElement("button");
      approveBtn.textContent = "Approve";
      approveBtn.onclick = () => approveWithdrawal(w.id, w.user_id, w.amount);

      const rejectBtn = document.createElement("button");
      rejectBtn.textContent = "Reject";
      rejectBtn.className = "reject";
      rejectBtn.onclick = () => rejectWithdrawal(w.id);

      div.appendChild(approveBtn);
      div.appendChild(rejectBtn);
      container.appendChild(div);
    });
  }

  async function loadAll() {
    await Promise.all([loadUsers(), loadDeposits(), loadWithdrawals()]);
  }

  requireAdmin().then(user => {
    if (user) loadAll();
  });
</script>
</body>
</html>
