<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit - Profit Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070c;
    --bg-soft:#0b0f18;
    --card:#11151f;
    --border:#232b3d;
    --gold:#f0b90b;
    --gold-soft:#f0b90b1a;
    --text:#eef1f6;
    --text-dim:#8b93a7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(240,185,11,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
  }
  h1,h2{font-family:'Space Grotesk',sans-serif;color:var(--text);margin:0;}
  a{color:var(--gold);text-decoration:none;}
  .card-wrap{max-width:480px;width:100%;opacity:0;transform:translateY(16px);animation:cardIn .6s cubic-bezier(.22,1,.36,1) forwards .1s;}
  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
  .top-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13.5px;font-weight:600;margin-bottom:18px;}
  .top-link:hover{color:var(--gold);}
  .form-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px 30px;box-shadow:0 24px 70px rgba(0,0,0,0.4);}
  .eyebrow{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(240,185,11,0.3);padding:6px 14px;border-radius:20px;margin-bottom:16px;}
  .form-card h1{font-size:25px;margin-bottom:6px;}
  .form-card .sub{color:var(--text-dim);font-size:14px;margin-bottom:26px;}
  .field{margin-bottom:18px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
  input,select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-soft);color:var(--text);font-size:14.5px;}
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,185,11,0.15);}
  .amount-wrap{position:relative;}
  .amount-wrap .prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-weight:600;font-size:14.5px;pointer-events:none;}
  .amount-wrap input{padding-left:28px;}
  .method-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .method-tab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;cursor:pointer;}
  .method-tab.active{border-color:var(--gold);background:var(--gold-soft);}
  .method-tab.active .lbl{color:var(--gold);}
  .method-panel{display:none;}
  .method-panel.active{display:block;}
  button{width:100%;padding:14px;background:linear-gradient(145deg,var(--gold),#c99500);color:#05070c;font-size:15.5px;font-weight:700;border:none;border-radius:10px;cursor:pointer;}
  button:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(240,185,11,0.35);}
  button:disabled{opacity:0.6;cursor:not-allowed;}
</style>
</head>
<body>
<div class="card-wrap">
  <a href="userportal.html" class="top-link">← Back to Portal</a>
  <div class="form-card" id="depositForm">
    <span class="eyebrow">Deposit</span>
    <h1>Deposit Funds</h1>
    <p class="sub">Choose how you'd like to make your deposit.</p>

    <div class="method-tabs">
      <div class="method-tab active" data-method="crypto">
        <div class="ic">🪙</div><div class="lbl">Crypto Wallet</div>
      </div>
      <div class="method-tab" data-method="giftcard">
        <div class="ic">🎁</div><div class="lbl">Gift Card</div>
      </div>
    </div>

    <form id="depForm">
      <div class="field">
        <label for="amount">Deposit Amount</label>
        <div class="amount-wrap">
          <span class="prefix">$</span>
          <input type="number" id="amount" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
        </div>
      </div>

      <!-- CRYPTO PANEL -->
      <div class="method-panel active" id="panel-crypto">
        <div class="field">
          <label for="network">Network</label>
          <select id="network">
            <option value="BTC">Bitcoin (BTC)</option>
            <option value="ETH">Ethereum (ETH)</option>
            <option value="USDT-TRC20">USDT (TRC20)</option>
            <option value="USDT-ERC20">USDT (ERC20)</option>
            <option value="BNB">BNB Smart Chain</option>
          </select>
        </div>
        <div class="field">
  
        </div>
      </div>

      <!-- GIFT CARD PANEL -->
      <div class="method-panel" id="panel-giftcard">
        <div class="field">
          <label for="giftBrand">Gift Card Brand</label>
          <select id="giftBrand">
            <option value="Amazon">Amazon</option>
            <option value="Apple/iTunes">Apple / iTunes</option>
            <option value="Google Play">Google Play</option>
            <option value="Steam">Steam</option>
            <option value="Visa Prepaid">Visa Prepaid</option>
            <option value="Walmart">Walmart</option>
          </select>
        </div>
      </div>

      <button type="submit" id="depositBtn">Submit Deposit Request</button>
    </form>
  </div>
</div>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://zjqknqnvlmlkkgzglvjk.supabase.co',
    'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
  );

  let currentMethod = "crypto";

  // Tab switching
  document.querySelectorAll(".method-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".method-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".method-panel").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      currentMethod = tab.dataset.method;
      document.getElementById("panel-" + currentMethod).classList.add("active");
    });
  });

  const depForm = document.getElementById("depForm");
  const depositBtn = document.getElementById("depositBtn");

  depForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
      alert("Please log in first.");
      window.location.href = "login.html";
      return;
    }

    const amount = Number(document.getElementById("amount").value);
    if (!Number.isFinite(amount) || amount <= 0) {
      alert("Please enter a valid deposit amount.");
      return;
    }

    // Build wallet_address string from selected method
    let methodInfo = "";
    if (currentMethod === "crypto") {
      const network = document.getElementById("network").value;
      methodInfo = "Crypto - " + network;
    } else {
      const giftBrand = document.getElementById("giftBrand").value;
      methodInfo = "GiftCard - " + giftBrand;
    }

    const payload = {
      user_id: user.id,
      amount: amount,
      wallet_address: methodInfo, // reuse wallet_address column
      status: "Pending"
    };

    depositBtn.disabled = true;
    depositBtn.textContent = "Submitting...";

    const { error } = await supabase.from('deposits').insert(payload);

    if (error) {
      alert("Error: " + error.message);
      depositBtn.disabled = false;
      depositBtn.textContent = "Submit Deposit Request";
      return;
    }

    // Redirect to Telegram after successful insert
    window.location.href = "https://t.me/Profit_Time_Agent";
  });
</script>


</body>
</html>
