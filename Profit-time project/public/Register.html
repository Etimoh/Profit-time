<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Profit Time</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
    }

    h1 {
      color: #FFD700;
      text-align: center;
      margin-top: 40px;
    }

    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #111;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #FFD700;
      box-shadow: 0 0 20px #FFD700;
    }

   input, select {
  width: 100%;
  max-width: 100%;
  padding: 10px 0px 10px 10px;
  margin-bottom: 15px;
  border: 1.5px solid #FFD700;
  border-radius: 5px;
  background-color: #000;
  color: #fff;
  font-size: 14px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
  color: #FFD700;
  font-size: 14px;
}

    input:focus, select:focus {
      outline: none;
      border-color: #fff;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 0px;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #FFD700;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      outline: none;
    }

    .toggle-password:hover,
    .toggle-password:focus,
    .toggle-password:active {
      background: none;
      color: #FFD700;
      outline: none;
      box-shadow: none;
    }

    button {
      width: 100%;
      padding: 15px;
      background-color: #FFD700;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #fff;
      color: #000;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success-message {
      text-align: center;
      color: #FFD700;
      font-size: 20px;
      margin-top: 20px;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .login-link a {
      color: #FFD700;
      text-decoration: none;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: #fff;
    }

    @media (max-width: 600px) {
      .form-container {
        margin: 20px;
        padding: 20px;
      }
      h1 {
        font-size: 22px;
      }
      button {
        font-size: 16px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <h1>Register Your Investment</h1>

  <div class="form-container" id="registrationForm">
    <form id="regForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" required minlength="6">
        <span class="toggle-password" onclick="togglePassword('password')">👁</span>
      </div>

      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrapper">
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁</span>
      </div>

      <label for="location">Select Location</label>
      <select id="location" name="location" required>
        <option value="">-- Choose Location --</option>
        <option value="Nigeria">Nigeria</option>
        <option value="USA">USA</option>
        <option value="UK">UK</option>
        <option value="Canada">Canada</option>
        <option value="Other">Other</option>
      </select>

      <label for="amount">Investment Amount Range</label>
      <select id="amount" name="amount" required>
        <option value="">-- Choose Range --</option>
        <option value="100-499">$100 - $499</option>
        <option value="500-999">$500 - $999</option>
        <option value="1000-4999">$1,000 - $4,999</option>
        <option value="5000+">$5,000+</option>
      </select>

      <label for="package">Select Package</label>
      <select id="package" name="package" required>
        <option value="">-- Choose Package --</option>
        <option value="Starter">Starter (13% ROI Weekly)</option>
        <option value="Growth">Growth (16% ROI Weekly)</option>
        <option value="Premium">Premium (20% ROI Weekly)</option>
        <option value="Elite">Elite (24% ROI Weekly)</option>
      </select>

      <button type="submit" id="regSubmitBtn">Register</button>
    </form>
  </div>

  <div class="success-message" id="successMessage" style="display:none;">
    🎉 Thank you for registering! Your account has been created.
    <div class="login-link">
      <a href="login.html">Proceed to Login</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://zjqknqnvlmlkkgzglvjk.supabase.co',
      'sb_publishable_YXPm0Uo8HmW-Fg2N5LFUdA_X2POjW9u'
    );

    window.togglePassword = function (fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === "password" ? "text" : "password";
    };

    const regForm = document.getElementById("regForm");
    const submitBtn = document.getElementById("regSubmitBtn");

    regForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const location = document.getElementById("location").value;
      const amount = document.getElementById("amount").value;
      const packageChoice = document.getElementById("package").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Registering...";

      // 1. Create the auth user
      const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
        email,
        password
      });

      if (signUpError) {
        alert("Registration failed: " + signUpError.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
        return;
      }

      const user = signUpData.user;

      if (!user) {
        // Email confirmation is likely required before a session exists
        alert("Check your email to confirm your account, then log in.");
        window.location.href = "login.html";
        return;
      }

      // 2. Fill in the profile row (auto-created by the on_auth_user_created trigger)
      const { error: profileError } = await supabase
        .from('profiles')
        .update({
          name,
          location,
          amount_range: amount,
          package_choice: packageChoice
        })
        .eq('id', user.id);

      if (profileError) {
        alert("Account created, but saving your details failed: " + profileError.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
        return;
      }

      document.getElementById("registrationForm").style.display = "none";
      document.getElementById("successMessage").style.display = "block";
    });
  </script>
</body>
</html>
