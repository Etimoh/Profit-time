    h1 {
      color: #FFD700;

    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #111;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #FFD700;
      box-shadow: 0 0 20px #FFD700;

   /* General input styling */
input, select {
  width: 100%;
  max-width: 100%;   /* prevents stretching */
  
  padding: 10px 0px 10px 10px;     /* slightly smaller padding */
  margin-bottom: 15px; /* consistent spacing */
  border: 1.5px solid #FFD700; /* thinner border */
  border-radius: 5px;
  background-color: #000;
  color: #fff;
  font-size: 14px;   /* smaller font size */
}

/* Labels */
label {
  display: block;
  margin-bottom: 6px; /* tighter spacing */
  font-weight: 500;   /* lighter weight */
  color: #FFD700;
  font-size: 14px;
}


    input:focus, select:focus {
      outline: none;
      border-color: #fff;
    }
    /* Adjust only the name and email fields */
#name, #email {
  padding: -10px;          /* reduce padding so they’re not oversized */
  margin-bottom: 15px;    /* consistent spacing */
  border: 1.5px solid #FFD700; /* thinner border */
  font-size: 14px;        /* smaller text size */
  max-width: 100%;        /* prevent stretching */
}

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 0px;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #FFD700;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      outline: none;
    }

    .toggle-password:hover,
    .toggle-password:focus,
    .toggle-password:active {
      background: none;
      color: #FFD700;
      outline: none;
      box-shadow: none;
    }

    button {
      width: 100%;
      padding: 15px;
      background-color: #FFD700;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #fff;
      color: #000;
    }

    .success-message {
      text-align: center;
      color: #FFD700;
      font-size: 20px;
      margin-top: 20px;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .login-link a {
      color: #FFD700;
      text-decoration: none;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: #fff;
    }

    /* Responsive Media Queries */
    @media (max-width: 600px) {
      .form-container {
        margin: 20px;
        padding: 20px;
      }
      h1 {
        font-size: 22px;
      }
      button {
        font-size: 16px;
        padding: 12px;
      }
    }

    @media (max-width: 900px) {
      .form-container {
        max-width: 500px;
      }
      h1 {
        font-size: 26px;
      }
    }

    @media (min-width: 901px) {
      .form-container {
        max-width: 600px;
      }
      h1 {

      }
    }
  </style>
